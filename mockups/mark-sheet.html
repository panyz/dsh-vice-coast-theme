<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>brand mark</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1600px; height: 380px; overflow: hidden; background: #150420;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; gap: 13px; padding: 22px 32px; }
  .pane { border-radius: 16px; padding: 16px 22px 18px; flex: 1; display: flex; flex-direction: column; gap: 14px;
    box-shadow: inset 0 0 0 1px var(--line); }
  .head { display: flex; align-items: baseline; gap: 10px; }
  .t { font-size: 11.5px; font-weight: 500; letter-spacing: .14em; }
  .s { font-size: 12.5px; opacity: .62; }
  .row { display: flex; align-items: flex-end; gap: 22px; }
  .mk { position: relative; display: inline-block; width: var(--e); height: var(--e); border-radius: var(--r);
    background: linear-gradient(160deg,#FF2E8F 0%,#FF5F55 52%,#FFA24A 100%); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.3); overflow: hidden; flex: none; }
  .mk img { position: absolute; left: 4%; bottom: 8%; width: 92%; height: 84%; object-fit: contain; display: block; }
</style>

  <section class="pane" style="background:#150420;color:#F8F2F7;--line:#ffd9c629;--dim:#A38FB4">
    <div class="head"><span class="t">夜驾 NIGHT DRIVE</span><span class="s">默认标识：落日盘 + 海平线，站在同一块日落底板上</span></div>
    <div class="row"><span class="mk" style="--e:96px;--r:29px"><img src="logo-default.png" alt=""></span><span class="mk" style="--e:64px;--r:19px"><img src="logo-default.png" alt=""></span><span class="mk" style="--e:34px;--r:10px"><img src="logo-default.png" alt=""></span><span class="mk" style="--e:24px;--r:7px"><img src="logo-default.png" alt=""></span></div>
  </section>

  <section class="pane" style="background:#FBF7F6;color:#21102E;--line:#21102e21;--dim:#736180">
    <div class="head"><span class="t">明信片 POSTCARD</span><span class="s">想换成自己的头像：见 README 的「换成你的标识」一节</span></div>
    <div class="row"><span class="mk" style="--e:96px;--r:29px"><img src="logo-default.png" alt=""></span><span class="mk" style="--e:64px;--r:19px"><img src="logo-default.png" alt=""></span><span class="mk" style="--e:34px;--r:10px"><img src="logo-default.png" alt=""></span><span class="mk" style="--e:24px;--r:7px"><img src="logo-default.png" alt=""></span></div>
  </section>
</html>
